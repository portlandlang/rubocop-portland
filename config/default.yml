  Difference: taste
  Status: decided

Portland/RaiseRescue:
  Description: 'Portland has no exceptions; a fallible operation returns its value or a failure.'
  Enabled: true
  VersionAdded: '<<next>>'
  Reference: 'https://github.com/portlandlang/portland/blob/main/docs/ruby/errors.md'
  Difference: thesis
  Status: decided

Portland/SingletonClass:
  Description: 'Portland has no `class << self`; each type function is `def self.name`.'
  Enabled: true
  VersionAdded: '<<next>>'
  Reference: 'https://github.com/portlandlang/portland/blob/main/docs/ruby/classes.md'
  Difference: taste
  Status: decided
