# One cop per Ruby difference portland's ledger (docs/ruby/*.md) names.
#
# Beyond RuboCop's own keys, each cop carries:
#   Difference: thesis | taste | gap — principle 2's kinds (docs/principles.md):
#     thesis, a difference Portland exists for; taste, a spelling it removed,
#     which defaults to Ruby and must name what it buys; gap, something not
#     decided or built yet.
#   Status: decided | undecided
# ruby_research's readiness census reads these to grade each gem.

Portland/BeginEndBlock:
  Description: 'Portland has no `BEGIN` or `END` blocks.'
  Enabled: true
  VersionAdded: '<<next>>'
  Reference: 'https://github.com/portlandlang/portland/blob/main/docs/ruby/removed-syntax.md'
  Difference: taste
  Status: decided

Portland/ClassVariable:
  Description: 'Portland has no class variables; shared mutable state is what it exists to avoid.'
  Enabled: true
  VersionAdded: '<<next>>'
  Reference: 'https://github.com/portlandlang/portland/blob/main/docs/ruby/classes.md'
  Difference: thesis
  Status: decided

Portland/EvalFamily:
  Description: 'Portland has no `eval`, `send`, `instance_eval`, or reaching instance variables by name.'
  Enabled: true
  VersionAdded: '<<next>>'
  Reference: 'https://github.com/portlandlang/portland/blob/main/docs/ruby/metaprogramming.md'
  Difference: thesis
  Status: decided

Portland/Fetch:
  Description: 'Portland retires `fetch`; `collection[key] or default` says it.'
  Enabled: true
  VersionAdded: '<<next>>'
  Reference: 'https://github.com/portlandlang/portland/blob/main/docs/ruby/lookups.md'
  Difference: taste
  Status: decided

Portland/FlipFlop:
  Description: 'Portland has no flip-flops.'
  Enabled: true
  VersionAdded: '<<next>>'
  Reference: 'https://github.com/portlandlang/portland/blob/main/docs/ruby/removed-syntax.md'
  Difference: taste
  Status: decided

Portland/ForLoop:
  Description: 'Portland has no `for`; `each` is the one loop over a collection.'
  Enabled: true
  SafeAutoCorrect: false
  VersionAdded: '<<next>>'
  Reference: 'https://github.com/portlandlang/portland/blob/main/docs/ruby/removed-syntax.md'
  Difference: taste
  Status: decided

Portland/FreezeFamily:
  Description: 'Portland values never mutate, so `freeze`, `frozen?`, `dup`, and `clone` have nothing to do.'
  Enabled: true
  VersionAdded: '<<next>>'
  Reference: 'https://github.com/portlandlang/portland/blob/main/docs/ruby/mutability.md'
  Difference: thesis
  Status: decided

Portland/GlobalVariable:
  Description: 'Portland has no global variables or special variables.'
  Enabled: true
  VersionAdded: '<<next>>'
  Reference: 'https://github.com/portlandlang/portland/blob/main/docs/ruby/removed-syntax.md'
  Difference: taste
  Status: decided

Portland/InPlaceMutator:
  Description: 'Portland values never mutate; the in-place mutators have no Portland meaning.'
  Enabled: true
  VersionAdded: '<<next>>'
  Reference: 'https://github.com/portlandlang/portland/blob/main/docs/ruby/mutability.md'
